name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint + testy backendu
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      SANDBOX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (bez red-team, bez sieci, bez LLM)
        run: pytest --ignore=tests/redteam -m "not network and not llm"

  sanitizer-redteam:
    name: Testy sanitizera i red-team (offline)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      SANDBOX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest tests/redteam
        run: |
          if [ -d tests/redteam ]; then pytest tests/redteam -m "not network and not llm"; else echo "brak testów red-team"; fi
      - name: Eval agenta offline (mock + model „łatwowierny”)
        run: |
          if [ -f redteam/eval_agent.py ]; then python -m redteam.eval_agent --llm gullible --no-report --strict; else echo "brak eval"; fi

  frontend:
    name: Build + testy frontendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci / typecheck / test / build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
