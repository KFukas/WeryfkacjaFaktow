name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint + testy backendu
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      SANDBOX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check .
      - name: Pytest (bez red-team, bez sieci, bez LLM)
        run: pytest --ignore=tests/redteam -m "not network and not llm"

  sanitizer-redteam:
    name: Testy sanitizera i red-team (offline)
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      SANDBOX_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Pytest tests/redteam
        run: |
          if [ -d tests/redteam ]; then pytest tests/redteam -m "not network and not llm"; else echo "brak testów red-team"; fi
      - name: Eval agenta offline (mock + model „łatwowierny”)
        run: |
          if [ -f redteam/eval_agent.py ]; then python -m redteam.eval_agent --llm gullible --no-report --strict; else echo "brak eval"; fi

  frontend:
    name: Build + testy frontendu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: detect
        run: |
          if [ -f frontend/package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci / typecheck / test / build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

  docker:
    name: Docker compose — build i test dymny
    runs-on: ubuntu-latest
    needs: [backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build i start (api, db, mcp-web-sandbox, frontend)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Weryfikacja artykułu przez API w Dockerze (sandbox po HTTP w osobnym kontenerze)
        run: |
          set -e
          curl -fsS http://localhost:8000/api/health
          curl -fsS http://localhost:8080/ | grep -q "Kurier"
          RUN=$(curl -fsS -X POST http://localhost:8000/api/articles/2/verify -H 'Content-Type: application/json' -d '{}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          for i in $(seq 1 90); do
            STATUS=$(curl -fsS http://localhost:8000/api/runs/$RUN | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
            [ "$STATUS" != "queued" ] && [ "$STATUS" != "running" ] && break
            sleep 2
          done
          echo "status: $STATUS"; test "$STATUS" = "completed"
          curl -fsS http://localhost:8000/api/articles/2/claims | python3 -c 'import sys,json; v=sorted({c["verdict"] for c in json.load(sys.stdin)}); print(v); assert v==["fałszywe","potwierdzone"], v'
          curl -fsS http://localhost:8080/api/articles | python3 -c 'import sys,json; assert len(json.load(sys.stdin))>=4'
      - name: Izolacja sandboksa — brak sekretów i brak dostępu do bazy
        run: |
          set -e
          docker compose exec -T mcp-web-sandbox sh -c 'env | grep -E "ANTHROPIC|DATABASE_URL" && exit 1 || echo "brak sekretów w środowisku sandboksa"'
          docker compose exec -T mcp-web-sandbox python -c "import socket; socket.create_connection(('db',5432),3)" && exit 1 || echo "sandbox nie łączy się z bazą"
          docker compose exec -T mcp-web-sandbox sh -c 'touch /sandbox/x 2>/dev/null && exit 1 || echo "system plików tylko do odczytu"'
      - name: Logi przy błędzie
        if: failure()
        run: docker compose logs --no-color | tail -300
      - name: Sprzątanie
        if: always()
        run: docker compose down -v
